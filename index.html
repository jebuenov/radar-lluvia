<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de lluvia</title>
<meta name="theme-color" content="#0f172a">
<!-- Política de seguridad: solo se ejecuta código de este sitio y solo se conecta a los servicios del radar, el mapa y la previsión. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://tilecache.rainviewer.com; connect-src 'self' https://api.rainviewer.com https://api.open-meteo.com https://tilecache.rainviewer.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root { --bg:#0f172a; --panel:rgba(15,23,42,.88); --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; z-index:1000; background:var(--panel); border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.35); backdrop-filter:blur(6px); }
  #top { top:12px; left:12px; right:12px; max-width:560px; padding:10px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #top h1 { font-size:15px; margin:0; font-weight:600; }
  #status { flex:1; min-width:180px; font-size:13px; }
  #status b { font-weight:600; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:var(--muted); vertical-align:middle; }
  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
  #bottom { left:12px; right:12px; bottom:22px; max-width:560px; margin:0 auto; padding:10px 14px; display:flex; gap:12px; align-items:center; }
  button { background:#1e293b; color:var(--fg); border:1px solid #334155; border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#0f172a; border-color:var(--accent); }
  #play { width:40px; font-size:16px; }
  #slider { flex:1; accent-color:var(--accent); }
  #time { min-width:118px; text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
  #time small { display:block; color:var(--muted); }
  #tools { position:absolute; z-index:1000; right:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:6px; padding:8px; }
  #tools select { background:#1e293b; color:var(--fg); border:1px solid #334155; border-radius:8px; padding:5px; font:inherit; }
  #tools label { font-size:12px; color:var(--muted); }
  #legend { position:absolute; z-index:1000; left:12px; bottom:92px; padding:6px 10px; font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  #legend .bar { width:120px; height:8px; border-radius:4px; background:linear-gradient(90deg,#ded099,#88ddee,#00a3e0,#004a70,#ffee00,#ffaa00,#ff4400,#c10000); }
  body.dark .basemap { filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  .leaflet-container { background:#e5e3df; } body.dark .leaflet-container { background:#1a1c20; }
  .leaflet-control-attribution { font-size:10px; }
  .me { position:relative; width:30px; height:30px; border-radius:50%; background:#0ea5e9; border:4px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.45); }
  .me::after { content:''; position:absolute; inset:-14px; border-radius:50%; border:3px solid #0ea5e9; animation:pulse 2s ease-out infinite; }
  @keyframes pulse { from { transform:scale(.5); opacity:1; } to { transform:scale(1.4); opacity:0; } }
  #locate { position:absolute; z-index:1000; left:50%; transform:translateX(-50%); bottom:96px; padding:12px 22px; font-size:17px; font-weight:600; border-radius:999px; background:#0ea5e9; color:#fff; border:2px solid #fff; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  #locate:hover { background:#0284c7; }
  #forecast { top:12px; right:12px; width:400px; padding:10px 12px; }
  #forecast h2 { margin:0 0 2px; font-size:14px; font-weight:600; }
  #fc-summary { font-size:12px; color:var(--muted); margin-bottom:8px; }
  #fc-hours { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; text-align:center; }
  .fc-h { background:rgba(30,41,59,.7); border-radius:8px; padding:6px 2px; font-size:12px; }
  .fc-h .t { color:var(--muted); } .fc-h .ic { font-size:22px; line-height:1.3; } .fc-h .tp { font-weight:600; font-size:13px; }
  .fc-h .pr { font-size:11px; color:var(--muted); } .fc-h .pr.wet { color:var(--accent); font-weight:600; }
  .fc-h .bar { height:4px; margin:4px 6px 0; border-radius:2px; background:#334155; overflow:hidden; } .fc-h .bar i { display:block; height:100%; background:var(--accent); }
  @media (max-width:1050px) { #top { right:424px; } }
  @media (max-width:760px) { #top { right:12px; } #forecast { top:70px; left:12px; right:12px; width:auto; } #tools { top:auto; transform:none; bottom:150px; } #legend { display:none; } #locate { bottom:90px; } }
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="panel">
  <h1>☔ Radar de lluvia</h1>
  <div id="status"><span class="dot"></span>Cargando radar…</div>
</div>

<div id="forecast" class="panel">
  <h2>Próximas 6 horas</h2>
  <div id="fc-summary">Cargando previsión…</div>
  <div id="fc-hours"></div>
</div>

<button id="locate" title="Centrar el mapa en mi ubicación">📍 Mi ubicación</button>

<div id="tools" class="panel">
  <button id="alerts" title="Notificar cuando la lluvia se acerque">🔔 Avisos: no</button>
  <label for="radius">Radio de aviso</label>
  <select id="radius">
    <option value="10">10 km</option>
    <option value="25" selected>25 km</option>
    <option value="50">50 km</option>
  </select>
  <button id="theme" title="Cambiar mapa base">🌓 Mapa</button>
</div>

<div id="legend" class="panel">débil <span class="bar"></span> fuerte</div>

<div id="bottom" class="panel">
  <button id="play" title="Reproducir / pausar">⏸</button>
  <input id="slider" type="range" min="0" max="0" value="0" aria-label="Momento del radar">
  <div id="time">--:--<small>&nbsp;</small></div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
