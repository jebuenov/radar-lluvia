<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de lluvia</title>
<meta name="theme-color" content="#0f172a">
<!-- Política de seguridad: solo se ejecuta código de este sitio y solo se conecta a los servicios del radar, el mapa y la previsión. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://tilecache.rainviewer.com; connect-src 'self' https://api.rainviewer.com https://api.open-meteo.com https://tilecache.rainviewer.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root { --bg:#0f172a; --panel:rgba(15,23,42,.88); --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; z-index:1000; background:var(--panel); border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.35); backdrop-filter:blur(6px); }
  #top { top:12px; left:12px; width:340px; padding:16px 18px 12px; display:flex; flex-direction:column; gap:12px; }
  #clock { line-height:1; text-align:center; }
  #clock-time { font-size:64px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-1px; }
  #clock-time small { font-size:26px; color:var(--muted); font-weight:500; letter-spacing:0; margin-left:2px; }
  #clock-date { font-size:15px; color:var(--muted); margin-top:6px; }
  #status { display:flex; gap:12px; align-items:center; padding:10px 12px; border-radius:10px; background:rgba(30,41,59,.75); border-left:4px solid var(--muted); }
  #status.ok { border-left-color:var(--ok); } #status.warn { border-left-color:var(--warn); } #status.bad { border-left-color:var(--bad); }
  #rain-ic { font-size:30px; line-height:1; }
  #rain-main { font-size:18px; font-weight:600; }
  #rain-main b { color:#fff; }
  #status.bad #rain-main b { color:var(--bad); } #status.warn #rain-main b { color:var(--warn); }
  #rain-sub { font-size:12.5px; color:var(--muted); margin-top:2px; }
  #rain-sub b { color:var(--fg); font-weight:600; }
  #brand { font-size:11.5px; color:var(--muted); display:flex; justify-content:space-between; }
  #bottom { left:12px; right:12px; bottom:22px; max-width:560px; margin:0 auto; padding:10px 14px; display:flex; gap:12px; align-items:center; }
  button { background:#1e293b; color:var(--fg); border:1px solid #334155; border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#0f172a; border-color:var(--accent); }
  #play { width:40px; font-size:16px; }
  #slider { flex:1; accent-color:var(--accent); }
  #time { min-width:118px; text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
  #time small { display:block; color:var(--muted); }
  [hidden] { display:none !important; }
  #tools { position:absolute; z-index:1000; right:60px; bottom:22px; display:flex; flex-direction:column; gap:6px; padding:8px; }
  #tools select { background:#1e293b; color:var(--fg); border:1px solid #334155; border-radius:8px; padding:5px; font:inherit; }
  #tools label { font-size:12px; color:var(--muted); }
  #legend { position:absolute; z-index:1000; left:12px; bottom:92px; padding:6px 10px; font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  #legend .bar { width:120px; height:8px; border-radius:4px; background:linear-gradient(90deg,#ded099,#88ddee,#00a3e0,#004a70,#ffee00,#ffaa00,#ff4400,#c10000); }
  body.dark .basemap { filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  .leaflet-container { background:#e5e3df; } body.dark .leaflet-container { background:#1a1c20; }
  .leaflet-control-attribution { font-size:10px; }
  .me { position:relative; width:30px; height:30px; border-radius:50%; background:#0ea5e9; border:4px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.45); }
  .me::after { content:''; position:absolute; inset:-14px; border-radius:50%; border:3px solid #0ea5e9; animation:pulse 2s ease-out infinite; }
  @keyframes pulse { from { transform:scale(.5); opacity:1; } to { transform:scale(1.4); opacity:0; } }
  #locate { position:absolute; z-index:1000; left:50%; transform:translateX(-50%); bottom:96px; padding:12px 22px; font-size:17px; font-weight:600; border-radius:999px; background:#0ea5e9; color:#fff; border:2px solid #fff; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  #locate:hover { background:#0284c7; }
  .leaflet-marker-draggable { cursor:grab; }
  .pick-popup .leaflet-popup-content-wrapper, .pick-popup .leaflet-popup-tip { background:var(--panel); color:var(--fg); box-shadow:0 4px 16px rgba(0,0,0,.4); }
  .pick-popup .leaflet-popup-content { margin:8px; }
  .pick-btn { background:#0ea5e9; color:#fff; border:none; font-weight:600; font-size:14px; padding:8px 12px; white-space:nowrap; }
  .pick-btn:hover { background:#0284c7; }
  #toast { position:absolute; z-index:1600; left:50%; transform:translateX(-50%); top:42%; max-width:calc(100% - 32px); background:var(--panel);
    color:var(--fg); padding:10px 16px; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.4); font-size:14px; text-align:center; }
  #forecast { top:12px; right:12px; width:400px; padding:10px 12px; }
  #forecast h2 { margin:0 0 2px; font-size:14px; font-weight:600; }
  #fc-summary { font-size:12px; color:var(--muted); margin-bottom:8px; }
  #fc-hours { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; text-align:center; }
  .fc-h { background:rgba(30,41,59,.7); border-radius:8px; padding:6px 2px; font-size:12px; }
  .fc-h .t { color:var(--muted); } .fc-h .ic { font-size:22px; line-height:1.3; } .fc-h .tp { font-weight:600; font-size:13px; }
  .fc-h .pr { font-size:11px; color:var(--muted); } .fc-h .pr.wet { color:var(--accent); font-weight:600; }
  .fc-h .bar { height:4px; margin:4px 6px 0; border-radius:2px; background:#334155; overflow:hidden; } .fc-h .bar i { display:block; height:100%; background:var(--accent); }
  #laundry { top:290px; right:12px; width:400px; padding:10px 12px; border-left:4px solid var(--muted); }
  #laundry.ok { border-left-color:var(--ok); } #laundry.warn { border-left-color:var(--warn); } #laundry.bad { border-left-color:var(--bad); }
  #laundry h2 { margin:0 0 8px; font-size:14px; font-weight:600; }
  .ld-row { display:flex; gap:12px; align-items:center; }
  #ld-ic { font-size:32px; line-height:1; }
  #ld-main { font-size:18px; font-weight:600; }
  #laundry.bad #ld-main { color:var(--bad); } #laundry.ok #ld-main { color:var(--ok); }
  #ld-sub { font-size:13px; color:var(--fg); margin-top:2px; }
  #ld-extra { font-size:12px; color:var(--muted); margin-top:6px; }
  .ld-ctrl { display:flex; flex-direction:column; gap:4px; margin-top:8px; padding-top:8px; border-top:1px solid #334155; font-size:12.5px; }
  .ld-ctrl select { background:#1e293b; color:var(--fg); border:1px solid #334155; border-radius:6px; padding:2px 4px; font:inherit; }
  #custom { position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
  #custom .panel { position:static; width:320px; max-width:100%; padding:16px 18px; }
  #custom h2 { margin:0 0 4px; font-size:17px; }
  #custom p { margin:0 0 10px; font-size:12.5px; color:var(--muted); }
  #custom-list { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; font-size:14px; }
  #custom-list input, .ld-ctrl input { accent-color:var(--accent); width:16px; height:16px; vertical-align:-3px; }
  #custom-close { width:100%; background:var(--accent); color:#0f172a; font-weight:600; border-color:var(--accent); }
  kbd { background:#334155; border-radius:4px; padding:1px 5px; font:inherit; font-size:11px; }
  body.minimal .panel, body.minimal #locate { display:none !important; }
  body.minimal .leaflet-control-zoom { display:none; }
  body.zen .panel, body.zen #locate, body.zen #show-ui, body.zen .leaflet-control-container { display:none !important; }
  body.zen #map { filter:brightness(.55) saturate(.7); transition:filter 2s; }
  body.zen.zen-night #map { filter:brightness(.3) saturate(.5); }
  body.zen.dark #map { filter:brightness(.8) saturate(.7); } body.zen.dark.zen-night #map { filter:brightness(.5) saturate(.5); }
  body.zen.zen-awake { cursor:default; } body.zen:not(.zen-awake) { cursor:none; }
  #zen { position:fixed; inset:0; z-index:1500; display:flex; align-items:center; justify-content:center; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.35) 0%, rgba(15,23,42,.75) 75%); }
  #zen-center { text-align:center; color:#f8fafc; text-shadow:0 4px 30px rgba(0,0,0,.6); transition:opacity 2s; }
  #zen-time { font-size:min(24vw, 42vh); font-weight:200; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  #zen-date { font-size:min(3.2vw, 5vh); font-weight:300; opacity:.85; margin-top:1vh; }
  #zen-line { font-size:min(2.6vw, 4vh); font-weight:400; opacity:.75; margin-top:2.5vh; }
  body.zen-night #zen-center { opacity:.55; }
  #zen-ctrl { position:absolute; bottom:28px; left:50%; transform:translateX(-50%); display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    opacity:0; transition:opacity .6s; pointer-events:none; }
  body.zen-awake #zen-ctrl { opacity:1; pointer-events:auto; }
  #zen-ctrl button { background:rgba(15,23,42,.8); padding:8px 14px; }
  #show-ui { position:absolute; z-index:1000; left:12px; bottom:22px; background:var(--panel); }
  @media (max-width:820px) { #forecast { width:360px; } }
  @media (max-width:760px) { #top { width:auto; right:12px; padding:12px 14px 10px; gap:8px; } #clock-time { font-size:44px; } #clock-time small { font-size:20px; } #clock-date { font-size:13px; } #brand { display:none; } #forecast { top:96px; left:12px; right:12px; width:auto; } #tools { left:12px; right:12px; bottom:150px; flex-direction:row; flex-wrap:wrap; justify-content:center; padding:6px; } #tools label { display:none; } #tools button, #tools select { padding:5px 8px; font-size:13px; } #locate { bottom:96px; padding:8px 16px; font-size:15px; } #laundry { left:12px; right:12px; width:auto; } #legend { display:none; } #locate { bottom:90px; } }
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="panel">
  <div id="clock" title="Hora en tu ubicación"><div id="clock-time">--:--</div><div id="clock-date">&nbsp;</div></div>
  <div id="status"><div id="rain-ic">⏳</div><div><div id="rain-main">Cargando radar…</div><div id="rain-sub">&nbsp;</div></div></div>
  <div id="brand"><span>☔ Radar de lluvia</span><span>Radar: RainViewer</span></div>
</div>

<div id="forecast" class="panel">
  <h2>Próximas 6 horas</h2>
  <div id="fc-summary">Cargando previsión…</div>
  <div id="fc-hours"></div>
</div>

 <div id="laundry" class="panel" hidden>
  <h2>🧺 Ropa tendida</h2>
  <div class="ld-row"><div id="ld-ic">🧺</div><div><div id="ld-main">Cargando…</div><div id="ld-sub"></div></div></div>
  <div id="ld-extra"></div>
  <div class="ld-ctrl">
    <label><input type="checkbox" id="ld-out"> Tengo ropa tendida (avisarme)</label>
    <label>Avisar con <select id="ld-margin"><option value="30">30 min</option><option value="60">1 hora</option><option value="120">2 horas</option></select> de margen</label>
  </div>
</div>

<button id="locate" title="Centrar el mapa en mi ubicación">📍 Mi ubicación</button>

<div id="tools" class="panel">
  <button id="alerts" title="Notificar cuando la lluvia se acerque">🔔 Avisos: no</button>
  <label for="radius">Radio de aviso</label>
  <select id="radius">
    <option value="10">10 km</option>
    <option value="25" selected>25 km</option>
    <option value="50">50 km</option>
  </select>
  <button id="theme" title="Cambiar mapa base">🌓 Mapa</button>
  <button id="laundry-mode" title="Modo ropa tendida">🧺 Ropa: no</button>
  <button id="zen-btn" title="Modo zen: pantalla tranquila con reloj grande (tecla Z)">🧘 Zen</button>
  <button id="customize" title="Mostrar u ocultar partes de la pantalla (tecla H: ocultar todo)">⚙️ Personalizar</button>
</div>

<div id="custom" hidden>
  <div class="panel" role="dialog" aria-labelledby="custom-title">
    <h2 id="custom-title">⚙️ Personalizar</h2>
    <p>Elige qué quieres ver. Se guarda en este navegador.</p>
    <div id="custom-list"></div>
    <p class="hint">Atajo: pulsa <kbd>H</kbd> para ocultar todo y ver solo el mapa.</p>
    <button id="custom-close">Listo</button>
  </div>
</div>

<div id="zen" hidden>
  <div id="zen-center">
    <div id="zen-time">--:--</div>
    <div id="zen-date">&nbsp;</div>
    <div id="zen-line">&nbsp;</div>
  </div>
  <div id="zen-ctrl">
    <button id="zen-sound">🔇 Sonido de lluvia: no</button>
    <button id="zen-full">⛶ Pantalla completa</button>
    <button id="zen-exit">✕ Salir del modo zen <kbd>Esc</kbd></button>
  </div>
</div>

<div id="toast" hidden role="status"></div>

<button id="show-ui" hidden title="Mostrar todo (tecla H)">👁 Mostrar todo <kbd>H</kbd></button>

<div id="legend" class="panel">débil <span class="bar"></span> fuerte</div>

<div id="bottom" class="panel">
  <button id="play" title="Reproducir / pausar">⏸</button>
  <input id="slider" type="range" min="0" max="0" value="0" aria-label="Momento del radar">
  <div id="time">--:--<small>&nbsp;</small></div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
